<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta
      name="description"
      content="A simple space to support your session: bilateral stimulation, breathing and personal check-ins. Your data stays in your browser."
    />
    <title>EMDR — Your space</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before loading styles to avoid a light flash on dark screens.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("emdr_theme");
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#10131c"
          : "#f7f8fc";
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside class="sidebar">
      <a class="brand" href="#" data-action="home"
        ><span class="brand-symbol" aria-hidden="true">∞</span
        ><span
          >emdr<span class="brand-caption">by Practical Humanism</span></span
        ></a
      >
      <p class="nav-label">YOUR SPACE</p>
      <nav aria-label="Main navigation">
        <button
          class="nav-item active"
          data-action="home"
          id="nav-home"
          aria-label="Your session"
        >
          <span data-icon="session"></span> Your session
        </button>
        <button
          class="nav-item"
          data-action="history"
          id="nav-history"
          aria-label="Session journal"
        >
          <span data-icon="chart"></span> Session journal
        </button>
        <button
          class="nav-item"
          data-action="guide"
          id="nav-guide"
          aria-label="User guide"
        >
          <span data-icon="book"></span> User guide
        </button>
      </nav>
      <div class="sidebar-journey">
        <p class="nav-label">ONE STEP AT A TIME</p>
        <ol id="journey"></ol>
      </div>
      <div class="sidebar-bottom">
        <span class="privacy-icon" data-icon="lock"></span
        ><strong>This space is yours.</strong>
        <p>No account. No data<br />sent to a server.</p>
        <a
          href="https://buymeacoffee.com/practicalhumanism"
          target="_blank"
          rel="noopener noreferrer"
          >Support the project ↗</a
        >
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span id="breadcrumb"
          >Your space <span class="slash">/</span>
          <strong>Your session</strong></span
        >
        <div class="topbar-actions">
          <button
            id="theme-toggle"
            class="text-button theme-toggle"
            data-action="theme"
            aria-label="Switch to dark mode"
            aria-pressed="false"
          >
            <span id="theme-icon" aria-hidden="true"></span
            ><span id="theme-label">Dark mode</span>
          </button>
          <button
            class="text-button"
            data-action="guide"
            aria-label="How it works"
          >
            <span data-icon="help"></span> How it works
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>Practical Humanism · Made for people.</span
        ><button class="text-button" data-action="privacy">
          <span data-icon="lock"></span> Privacy & data
        </button>
      </footer>
    </div>
    <dialog id="dialog">
      <div id="dialog-content"></div>
      <button class="button secondary" id="dialog-close">Close</button>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
